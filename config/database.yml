default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  adapter: sqlite3
  database: storage/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: storage/test.sqlite3

production:
  primary: &production_primary
    <<: *default
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *production_primary
    database_tasks: false
  queue:
    <<: *production_primary
    database_tasks: false
  cable:
    <<: *production_primary
    database_tasks: false
